name: DevSecOps Security Gate Pipeline

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secrets Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast-scan:
    name: Static Application Security Testing (Semgrep)
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Run Semgrep
        run: |
          python -m pip install semgrep
          semgrep scan --config p/security-audit --config p/owasp-top-ten --error
  sca-scan:
    name: Software Composition Analysis (Trivy)
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Trivy Dependency Scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "HIGH,CRITICAL"
          exit-code: "1"
  container-scan:
    name: Container Image Scanning (Trivy)
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build Docker image
        run: docker build --no-cache -t devsecops-project1:${{ github.sha }} .
      - name: Run Trivy Image Scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "devsecops-project1:${{ github.sha }}"
          scan-type: "image"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"
